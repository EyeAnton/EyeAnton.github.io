<!doctype html>
<!-- Source of assets/og.jpg (link preview, 1200×630). Regenerate: see README → «Превью ссылки». -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>OG preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../design-system.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .og { position: relative; isolation: isolate; width: 1200px; height: 630px; padding: 36px 64px 52px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .og .aurora { -webkit-mask-image: none; mask-image: none; }
    .og-logo { position: absolute; left: 56px; top: 48px; font: 500 30px/1 var(--font); letter-spacing: var(--track-snug); }
    .og-url { position: absolute; right: 56px; top: 36px; }
    .og-box { position: relative; width: 250px; height: 250px; margin-top: auto; }
    .og-box img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .og-box .gift { inset: auto; left: 50%; top: -22%; width: 86%; height: auto; transform: translateX(-50%); }
    .og .eyebrow { margin: 14px 0 0; font-size: 18px; }
    .og h1 { margin: 16px 0 0; font: 500 62px/1.08 var(--font); letter-spacing: var(--track-tight); }
  </style>
</head>
<body>
  <div class="og">
    <div class="aurora" aria-hidden="true"></div>
    <span class="og-logo">EyeAnton</span>
    <span class="btn ghost og-url">eyeanton.github.io</span>
    <div class="og-box">
      <img src="../assets/unbox/box_bottom.png" alt="">
      <img class="gift" src="https://eyeanton.github.io/gift-catalog/assets/thumbs/sep__diamond_3d.webp" alt="">
      <img src="../assets/unbox/box_hole.png" alt="">
    </div>
    <p class="eyebrow">Антон Егоров · AI Creative Technologist</p>
    <h1>Превращаю AI-генерацию<br>в масштабируемый продакшен</h1>
  </div>
</body>
</html>
